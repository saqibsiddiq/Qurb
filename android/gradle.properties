org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The native library is built by scripts/android-build.sh and copied into
# jniLibs, not by Gradle. Keeping cargo out of the Gradle build means the app
# builds from a clean checkout without an NDK, and means a Rust change is an
# explicit step rather than something that happens silently inside an IDE.
android.nonTransitiveRClass=true
