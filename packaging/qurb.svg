<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- The mark (decision 0048): a ring for your space, a stem that makes it a
       q, and a point of Qurb light inside. The same drawing as the window's
       (`#qurb-mark` in crates/desktop/ui/index.html), the Android launcher
       icon and the tray icon (crates/tray/src/icon.rs), so the applications
       menu, the panel and the window agree.

       crates/desktop/icons/icon.png is this file at 512 pixels:
       rsvg-convert -w 512 -h 512 packaging/qurb.svg -o crates/desktop/icons/icon.png -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c806a"/>
      <stop offset="1" stop-color="#22503f"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#tile)"/>
  <circle cx="14.4" cy="14.4" r="6.2" fill="none" stroke="#fff" stroke-width="2.6"/>
  <path d="M20.6 11 V24.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="14.4" cy="14.4" r="1.9" fill="#bde7d6"/>
</svg>
