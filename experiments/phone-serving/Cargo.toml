[package]
name = "phone-serving"
version = "0.0.0"
edition.workspace = true
publish = false

# Throwaway. Where a phone's serving of a large file spends its time, measured
# on the phone itself rather than through the app. See ./README.md for what it
# measures and what it cuts.

[dependencies]
anyhow.workspace = true
blake3.workspace = true
tokio.workspace = true
qurb-peer = { path = "../../crates/peer" }
qurb-storage = { path = "../../crates/storage" }
qurb-sync = { path = "../../crates/sync" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
