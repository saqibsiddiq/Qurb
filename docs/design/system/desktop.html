<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QurbSpace desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* The desktop's pages at real size, from the foundation's parts only.
   Each frame is the window: 1120 × 720. */
body { font-family: Inter, system-ui, sans-serif; background: color-mix(in srgb, var(--bg) 70%, #8f948c); color: var(--ink); -webkit-font-smoothing: antialiased }
.wrap { max-width: 1200px; margin: 0 auto; padding: 40px 24px 120px }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap }
.top h1 { font-size: 28px; font-weight: 700; letter-spacing: -.025em; color: var(--ink) }
.top p { color: var(--ink-2); margin-top: 6px; font-size: 14.5px; max-width: 760px; line-height: 1.55 }
.switch { display: inline-flex; padding: 4px; border-radius: var(--r-full); background: var(--surface); gap: 2px; box-shadow: var(--shadow-1) }
.switch button { border: 0; background: none; font: 500 13px Inter; color: var(--ink-2); padding: 7px 14px; border-radius: var(--r-full); cursor: pointer }
.switch button.on { background: var(--brand-soft); color: var(--brand) }
figure { margin-top: 48px }
figcaption { margin-bottom: 14px }
figcaption b { font-size: 16px; font-weight: 650; letter-spacing: -.01em }
figcaption span { display: block; color: var(--ink-2); font-size: 13.5px; margin-top: 4px; line-height: 1.5; max-width: 900px }

/* the window */
.win { width: 1120px; height: 720px; border-radius: 12px; overflow: hidden; display: flex; background: var(--bg); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.08); position: relative }
.win .tb { position: absolute; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px; z-index: 30 }
.win .tb i { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 18%, transparent) }
.sb { width: 232px; flex: none; padding: 52px 12px 16px; display: flex; flex-direction: column; gap: 2px; background: color-mix(in srgb, var(--surface-2) 55%, var(--bg)); border-right: 1px solid var(--line) }
.sb .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 22px; font-weight: 700; font-size: 15px; letter-spacing: -.01em }
.sb .brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; color: var(--on-brand) }
.sb .brand i .ic { width: 15px; height: 15px; stroke-width: 2.2 }
.sb .it { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: var(--r-s); color: var(--ink-2); font-size: 14px; font-weight: 500 }
.sb .it.on { background: var(--brand-soft); color: var(--brand); font-weight: 600 }
.sb .it .ic { width: 19px; height: 19px }
.main { flex: 1; position: relative; overflow: hidden }
.page { max-width: 600px; margin: 0 auto; padding: 56px 0 40px }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13.5px; font-weight: 500; margin-bottom: 10px }
.back .ic { width: 16px; height: 16px }
.ptitle { font-size: 28px; font-weight: 700; letter-spacing: -.025em }
.gap { height: 24px }
.lab { margin: 24px 4px 10px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3) }

/* Home */
.home { height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 108px }
.home .circle-at { position: absolute; top: 44px; right: 36px }
.state { font-size: 20px; font-weight: 650; letter-spacing: -.015em; margin-top: 26px }
.home .btn-primary { width: 360px; margin-top: 26px }
.wait { width: 560px; margin-top: 30px }
.whd { display: flex; align-items: center; gap: 8px; margin: 0 4px 10px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3) }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-size: 11.5px; letter-spacing: 0; display: grid; place-items: center }
.stack { position: relative; width: 62px; height: 46px; flex: none }
.stack .tile { position: absolute; top: 1px; border: 2px solid var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,.15) }
.stack .tile:nth-child(1) { left: 0; z-index: 3 } .stack .tile:nth-child(2) { left: 9px; z-index: 2; transform: rotate(6deg) } .stack .tile:nth-child(3) { left: 18px; z-index: 1; transform: rotate(12deg) }
.ringov { position: absolute; inset: 0; background: rgba(0,0,0,.32); display: grid; place-items: center }
.ringov svg { width: 26px; height: 26px }
.who { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600 }
.who .ic { width: 14px; height: 14px; color: var(--ink-3) }
.who .av { width: 20px; height: 20px; font-size: 10px }
.chips { display: flex; gap: 6px; margin-top: 6px }
.go { color: var(--ink-3) } .go.ic { width: 18px; height: 18px }
.tile.photo3 { background: linear-gradient(150deg,#c9e3b0,#5f9a5a 60%,#2b4a2a) }
.tile.photo4 { background: linear-gradient(170deg,#f4d6e0,#c26a8a 60%,#5b2a3d) }
.tile .play { width: 0; height: 0; border-left: 9px solid rgba(255,255,255,.95); border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 2px; position: relative; z-index: 1 }

/* device page */
.dhead { display: flex; align-items: center; gap: 18px; margin-top: 18px }
.dhead .av { width: 72px; height: 72px; font-size: 26px } .dhead .av .dot { width: 18px; height: 18px; border-width: 3px }
.dhead h2 { font-size: 26px; font-weight: 700; letter-spacing: -.02em }
.dhead p { color: var(--ink-3); font-size: 14px; margin-top: 3px }
.dhead .info { margin-left: auto; width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--ink-2) }
.reach { margin-top: 16px }
.full { width: 100% }
.btn-blue { background: color-mix(in srgb, var(--online) 13%, var(--bg)); color: var(--online) }

/* overlays */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; backdrop-filter: blur(2px) }
.over { position: absolute; left: calc(50% + 116px); top: 50%; transform: translate(-50%, -50%); z-index: 21 }
.sheet.wide { max-width: 420px }
.devc { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); margin-top: 8px }
.devc b { flex: 1; font-size: 15px; font-weight: 600 }
.devc small { color: var(--ink-3); font-size: 12.5px }
.devc.on { border-color: var(--brand); background: var(--brand-soft) }
.devc.on .ic { color: var(--brand) }
.devc.add { border-style: dashed; background: none; color: var(--ink-2) }
.devc.add .av { background: none; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-3) }
.sheet .label { margin: 16px 4px 0 }

/* files */
.places { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
.places .place { width: auto; height: 116px; position: relative }
.places .place .end { position: absolute; top: 16px; right: 16px; color: var(--ink-3) }
.places .place .end .ic { width: 16px; height: 16px }
.places .place.open { border-color: var(--brand); background: var(--brand-soft) }
.place .av { width: 34px; height: 34px; font-size: 14px }
.lockb { position: absolute; top: 12px; right: 12px }
.ask { text-align: center; padding: 6px 4px 0 }
.orb { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); position: relative }
.orb .ic { width: 28px; height: 28px }
.orb::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); animation: spin 1.2s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
.ask h4 { margin-top: 18px }
.ask .who { justify-content: center; margin-top: 10px; font-size: 13.5px; font-weight: 500; color: var(--ink-2) }

/* settings */
.profile { display: flex; align-items: center; gap: 16px; padding: 16px }
.profile .av { width: 60px; height: 60px }
.profile b { font-size: 18px; font-weight: 650; display: block; letter-spacing: -.01em }
.profile small { color: var(--ink-3); font-size: 13.5px }
.profile .ic { margin-left: auto; color: var(--ink-3) }
.free { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 18px }
.free small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 8px; letter-spacing: 0 }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); margin-top: 14px }
.bar i { display: block; height: 100% }
.swa { width: 12px; height: 12px; border-radius: 4px; flex: none; margin: 0 4px }

/* activity */
.fchips { display: flex; gap: 8px; margin-top: 18px }
.fchips .n { min-width: 18px; height: 18px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); font-size: 11px; display: grid; place-items: center; padding: 0 5px }
.arow .n2 { flex: 1; min-width: 0 }
.arow .n2 b { display: block; font-size: 15px; font-weight: 600 }
.arow .n2 small { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 13px; margin-top: 3px }
.arow .n2 small .av { width: 16px; height: 16px; font-size: 8px }
.arow .n2 small.bad { color: var(--warn) }
.arow time { color: var(--ink-3); font-size: 13px }
.bdg { position: absolute; right: 4px; bottom: -3px; width: 18px; height: 18px; border-radius: 9px; border: 2px solid var(--surface); display: grid; place-items: center; z-index: 5; color: #fff }
.bdg .ic { width: 10px; height: 10px; stroke-width: 2.4 }

/* D10 to D20 */
.wsect { margin: 28px 4px 12px }
.wsect b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em }
.wsect span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 3px }
.wsect span.wait { color: var(--warn) }
.wgrid { display: grid; grid-template-columns: repeat(7, 72px); gap: 10px }
.wgrid .th, .wgrid .ring { border-radius: 14px }
.th.more { background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 600; display: grid; place-items: center }
.xx { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 11px; border: 0; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center }
.xx .ic { width: 12px; height: 12px; stroke-width: 2.4 }
.shield { width: 72px; height: 72px; border-radius: 50%; margin: 4px auto 0; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center }
.shield .ic { width: 30px; height: 30px }
.ibtn { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; color: var(--ink-2) }
.ibtn .ic { width: 18px; height: 18px }
.vers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px }
.ver { border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; background: var(--surface) }
.ver .look { height: 150px; background: #fbfbf8; color: #333; font: 12px/1.55 ui-monospace, monospace; padding: 12px 14px; white-space: pre; text-align: left }
.ver .look s { text-decoration: none; background: #f7e1dd } .ver .look u { text-decoration: none; background: #dff1e6 }
.ver .by { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; font-weight: 500 }
.ver .by small { margin-left: auto; color: var(--ink-3) }
.center { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center }
.appmark { width: 80px; height: 80px; border-radius: 24px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; box-shadow: 0 12px 30px -10px color-mix(in srgb, var(--brand) 70%, transparent) }
.appmark .ic { width: 38px; height: 38px; stroke-width: 2.2 }
.quiet { color: var(--ink-3); font-size: 14px; margin-top: 8px }
.lnk { display: block; margin-top: 14px; color: var(--brand); font-size: 14px; font-weight: 500 }
.qr { width: 216px; height: 216px; border-radius: var(--r-l); background: #fff; margin-top: 24px; position: relative; padding: 16px; box-shadow: var(--shadow-2) }
.qrc { width: 100%; height: 100%; opacity: .85; background: repeating-linear-gradient(90deg,#111 0 8px,transparent 8px 16px), repeating-linear-gradient(0deg,#111 0 8px,transparent 8px 13px) }
.qr i { position: absolute; width: 48px; height: 48px; border: 9px solid #111; border-radius: 9px; background: #fff }
.digits { font-size: 30px; font-weight: 650; letter-spacing: .14em; margin-top: 22px; font-variant-numeric: tabular-nums }
.six { display: flex; gap: 8px; justify-content: center; margin: 18px 0 12px }
.six span { width: 42px; height: 54px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; font-weight: 650 }
.bigc { width: 52px; height: 52px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center }
.bigc .ic { width: 24px; height: 24px }
.bigc.pink { background: #f2e1e8; color: #9b5574 }
.desk { width: 1120px; height: 460px; border-radius: 12px; background: linear-gradient(135deg,#2c3e50,#4b6a64 60%,#7a8c6c); position: relative; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45) }
.toasts { position: absolute; top: 24px; right: 24px; width: 400px; display: grid; gap: 10px }
.toast { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(250,250,247,.97); color: #161815; box-shadow: 0 12px 30px rgba(0,0,0,.3) }
.toast b { display: block; font-size: 14px; font-weight: 600 }
.toast span { display: block; font-size: 13px; color: #5C605A; margin-top: 2px }
.toast small { color: #8B8E87; font-size: 11.5px }
.tbtn { display: inline-flex; margin-top: 10px; height: 30px; padding: 0 14px; border-radius: 15px; background: #E6EFEA; color: #2F6B57; font-size: 13px; font-weight: 600; align-items: center }
.appic { width: 40px; height: 40px; border-radius: 12px; background: #2F6B57; color: #fff; display: grid; place-items: center; flex: none }
.appic.warn { background: #F6EEDB; color: #946A24 }
.appic .ic { width: 20px; height: 20px }

/* Recently deleted, as Photos' (D13) */
.rdg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px }
.rd { display: flex; flex-direction: column; gap: 7px; min-width: 0 }
.rd .th { width: 100%; height: auto; aspect-ratio: 1; border-radius: 14px }
.rd .th.doc { padding: 22px 18px; gap: 6px } .rd .th.doc i { height: 5px } .rd .th.doc em { font-size: 10px; left: 10px; bottom: 10px }
.rd .th .play::before { border-left-width: 16px; border-top-width: 10px; border-bottom-width: 10px }
.rd small { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px }
.days { position: absolute; left: 8px; bottom: 8px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--warn); color: #fff; font-size: 11.5px; font-weight: 600; display: grid; place-items: center }
.tick { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; border: 2px solid #fff }
.tick .ic { width: 13px; height: 13px; stroke-width: 2.6 }
.tick.off { background: rgba(0,0,0,.2) }
.rd.sel .th { outline: 3px solid var(--brand); outline-offset: -3px }
.selbar { position: absolute; left: calc(50% + 116px); bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: var(--r-full); background: var(--surface); box-shadow: var(--shadow-2); border: 1px solid var(--line); z-index: 10 }
.selbar b { font-size: 14px; font-weight: 600; margin-right: 8px }
.selbar.quietbar { padding: 8px }
.selbar .btn .ic { margin-right: -2px }
</style>
</head>

<symbol id="alert" viewBox="0 0 24 24"><path d="M12 8v5M12 16h.01"/></symbol>

<symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>

<script>
document.querySelectorAll("[data-sb]").forEach((slot) => {
  const sb = document.getElementById("sb").content.firstElementChild.cloneNode(true);
  sb.querySelectorAll(".it").forEach((it) => it.classList.toggle("on", it.dataset.p === slot.dataset.sb));
  slot.replaceWith(sb);
});
function theme(t, b) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll(".switch button").forEach((x) => x.classList.toggle("on", x === b));
}
