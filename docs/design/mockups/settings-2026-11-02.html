<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F7F4;--surface:#FFFFFF;--surface2:#F0F0EC;--text:#171816;--text2:#5F625C;--text3:#8A8D86;
  --border:#E2E3DD;--green:#2F6B57;--greenSoft:#E8F0EC;--online:#2F7DE1;--offline:#D64545;
  --error:#A3423A;--errorBg:#F7E9E7;--neutral:#ECEEEC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#E9EBE6;color:var(--text);padding:32px 16px 64px}
header.page{max-width:1500px;margin:0 auto 28px}
header.page h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
header.page p{color:var(--text2);margin-top:6px;font-size:15px;line-height:1.5;max-width:900px}
.grid{display:flex;flex-wrap:wrap;gap:36px 28px;justify-content:center;max-width:1500px;margin:0 auto}
figure{display:flex;flex-direction:column;align-items:center;gap:12px;width:340px}
figcaption{font-size:13px;color:var(--text2);text-align:center;line-height:1.45;max-width:320px}
figcaption b{color:var(--text);font-weight:600;display:block;font-size:14px;margin-bottom:2px}
.phone{width:340px;height:720px;border-radius:44px;background:#111;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;
  background:radial-gradient(120% 60% at 0% 0%,#E3EEE8 0%,transparent 60%),radial-gradient(100% 50% at 100% 100%,#F3EEE2 0%,transparent 60%),var(--bg)}
.status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600}
.body{height:calc(100% - 34px);overflow:hidden;padding:0 18px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}.ic.xs{width:14px;height:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.topbar .back{margin-top:0}.icons{display:flex;gap:2px}
.back{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:16px;margin-top:14px;height:28px}
.titlerow{display:flex;align-items:center;gap:6px;margin-top:10px;min-height:48px}
.title{font-size:32px;font-weight:700;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title.top{margin-top:26px}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--text)}
.iconbtn.green{background:var(--greenSoft);color:var(--green)}
.path{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text3);margin-top:4px;white-space:nowrap;overflow:hidden}
.path span.on{color:var(--green);font-weight:600}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;margin:26px 4px 8px}
.card{background:var(--surface);border-radius:22px;border:1px solid var(--border)}
.devcard{display:flex;align-items:center;gap:14px;padding:16px}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;position:relative;background:linear-gradient(135deg,#c9b38f,#6f5a3d)}
.avatar.lap{background:linear-gradient(160deg,#f4b860 0%,#3d6f8f 55%,#c9a55a 100%)}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;width:16px;height:16px;border-radius:50%;background:var(--online);border:3px solid #fff}
.devname{font-size:18px;font-weight:600}
.devmeta{font-size:13px;color:var(--text2);margin-top:3px}
.chev{margin-left:auto;color:var(--text3)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;color:var(--green);position:relative}
.tile .n{color:var(--text);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.locked{opacity:.5}
.tile.sel{border:2px solid var(--green);background:var(--greenSoft)}
.tile .ck{position:absolute;top:12px;right:12px}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:23px;background:var(--surface);border:1px solid var(--border);padding:0 16px;color:var(--text3);font-size:15px;margin-top:12px}
.search.active{border:1.5px solid var(--green);color:var(--text)}
.rows{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;height:62px;padding:0 4px}
.ftile{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text2);flex:none;overflow:hidden}
.ftile.ph{border:none}
.fname{flex:1;min-width:0}
.fname .a{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname .b{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.size{font-size:13px;color:var(--text2)}
.ck{width:22px;height:22px;border-radius:11px;border:2px solid var(--text3);flex:none;display:grid;place-items:center;background:#fff}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.ck.part{background:var(--green);border-color:var(--green);color:#fff}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.gt{display:flex;flex-direction:column;gap:6px}.gi{aspect-ratio:1;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--green)}.gn{font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}
.photos div{aspect-ratio:1;border-radius:10px}
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border-radius:32px;background:rgba(255,255,255,.92);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text2);padding:6px 18px;border-radius:18px}
.tab.on{color:var(--green);font-weight:600;background:var(--greenSoft)}
.actionbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding-bottom:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text)}
.act.danger{color:var(--error)}
.pastebar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 18px 22px}
.pastebar .what{font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.btns{display:flex;gap:10px}
.btn{flex:1;height:46px;border-radius:23px;display:grid;place-items:center;font-weight:600;font-size:15px;border:1px solid var(--border);background:#fff}
.btn.primary{background:var(--green);color:#fff;border:none}
.btn.danger{background:var(--error);color:#fff;border:none}
.selhead{display:flex;align-items:center;gap:12px;margin-top:18px;height:44px}
.selhead .n{font-size:22px;font-weight:700;flex:1}
.selall{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--text2);gap:2px}
.scrim{position:absolute;inset:0;background:rgba(23,24,22,.32)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#FBFBF9;border-radius:28px 28px 0 0;padding:10px 20px 26px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:600;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:14px;height:50px;font-size:15px}
.opt .r{margin-left:auto;color:var(--green)}
.facts .opt{justify-content:space-between}
.facts .opt span:first-child{color:var(--text2)}
.menu{position:absolute;top:80px;right:16px;width:210px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:8px 0}
.menu .h{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text3);padding:8px 16px 4px}
.menu .o{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px}
.menu .o .r{margin-left:auto;color:var(--green)}
.menu hr{border:none;border-top:1px solid var(--border);margin:6px 0}
.pop{position:absolute;background:#2A2C29;color:#fff;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.pop b{font-size:15px;display:block}
.day{font-size:13px;font-weight:600;color:var(--text2);margin:18px 4px 2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);background:var(--surface2);border-radius:10px;padding:2px 8px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text2);font-size:15px}
.empty .ring{width:84px;height:84px;border-radius:50%;border:3px solid #D5E2DA;display:grid;place-items:center;background:#fff;color:var(--text3)}
.note{max-width:1500px;margin:40px auto 0;font-size:14px;color:var(--text2);line-height:1.6}
.note li{margin-left:18px}

.dark{position:absolute;inset:0;background:#000;color:#fff}
.dtop{position:absolute;top:34px;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(#000c,#0000)}
.dtop .n{flex:1;font-size:15px;font-weight:500}
.dtop .c{font-size:12px;color:#bbb}
.dbot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:16px 10px 26px;background:linear-gradient(#0000,#000c)}
.dbot .act{color:#fff}
.dimg{position:absolute;left:0;right:0;top:170px;height:330px}
.player{position:absolute;left:0;right:0;top:220px;height:200px;background:linear-gradient(135deg,#334,#556 60%,#223)}
.seek{position:absolute;left:18px;right:18px;bottom:110px}
.seek .t{display:flex;justify-content:space-between;font-size:11px;color:#ccc;margin-bottom:6px}
.bar{height:4px;border-radius:2px;background:#ffffff40;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff}
.bar.g{background:var(--neutral)}.bar.g i{background:var(--green)}
.play{position:absolute;left:50%;top:320px;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#ffffff30;display:grid;place-items:center}
.pdfpage{position:absolute;left:28px;right:28px;background:#fff;border-radius:4px;padding:16px}
.pdfpage i{display:block;height:6px;border-radius:3px;background:#ddd;margin:8px 0}
.dialog{position:absolute;left:0;right:0;bottom:0;background:#FBFBF9;border-radius:28px 28px 0 0;padding:10px 20px 26px}
.field{height:50px;border-radius:16px;border:1.5px solid var(--green);background:#fff;display:flex;align-items:center;padding:0 16px;font-size:16px;margin:14px 0 18px}
.field .sel{background:#cfe3d8}
.mark{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:6px auto 12px}
.center{text-align:center}
.line{font-size:14px;color:var(--text2);text-align:center;margin:6px 0 18px;line-height:1.45}
.progress{position:absolute;left:14px;right:14px;bottom:90px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.progress .top{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;margin-bottom:8px}
.progress .top .m{margin-left:auto;font-size:12px;color:var(--text2);font-weight:400}
.skel{height:62px;display:flex;align-items:center;gap:12px;padding:0 4px}
.skel b{width:44px;height:44px;border-radius:12px;background:#E9EAE5}
.skel i{height:12px;border-radius:6px;background:#E9EAE5;display:block}
.thin{height:3px;border-radius:2px;background:var(--neutral);overflow:hidden;margin-top:8px}
.thin i{display:block;height:100%;width:40%;background:var(--green);border-radius:2px}
.optrow{display:flex;align-items:center;gap:14px;padding:14px 4px;font-size:16px}
.optrow .t{flex:1}.optrow .t div{font-size:12px;color:var(--text3);margin-top:2px}
.cloudmini{display:inline-flex;vertical-align:middle;margin-left:4px;color:var(--text3)}
.greyed{opacity:.35}

.code{position:absolute;top:84px;left:0;right:0;bottom:0;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;color:#e8e8e3;white-space:pre;overflow:hidden}
.code .k{color:#9cd2b4}.code .v{color:#e6c38a}.code .c{color:#8a8d86}.code .n{color:#6d706a;display:inline-block;width:22px}
.tbl{position:absolute;top:96px;left:12px;right:12px;background:#fff;border-radius:10px;overflow:hidden;font-size:11.5px;color:var(--text)}
.tbl div{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr}.tbl span{padding:7px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden}
.tbl .h span{background:var(--surface2);font-weight:600}
.docpage{position:absolute;left:24px;right:24px;background:#fff;border-radius:4px;padding:18px 16px;color:#222;font-size:9px;line-height:1.5}
.docpage h4{font-size:13px;margin-bottom:6px}.docpage i{display:block;height:5px;border-radius:3px;background:#ddd;margin:6px 0}
.slide{position:absolute;left:18px;right:18px;height:170px;border-radius:6px;background:linear-gradient(135deg,#2F6B57,#1d3f33);color:#fff;padding:18px;font-size:16px;font-weight:600}
.slide small{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:6px}
.wave{position:absolute;left:24px;right:24px;top:330px;height:70px;display:flex;align-items:center;gap:3px}
.wave b{flex:1;background:#ffffff50;border-radius:2px}.wave b.p{background:#fff}
.cover{position:absolute;left:70px;right:70px;top:120px;aspect-ratio:1;border-radius:20px}
.ctrl{position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center;align-items:center;gap:36px}
.ctrl .big{width:64px;height:64px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.unk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.unk .ftile{width:84px;height:84px;border-radius:22px;background:#ffffff18;border:none;color:#fff}
.unk .n{font-size:17px;font-weight:600}.unk .m{font-size:13px;color:#aaa}
.unk .btn{flex:none;width:220px;margin-top:14px;background:#fff;color:#000;border:none}
.chips{position:absolute;top:92px;left:16px;display:flex;gap:6px}
.chips span{font-size:11px;background:#ffffff20;color:#ddd;border-radius:10px;padding:3px 9px}

.th{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit}
.th .dur{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;font-size:8px;border-radius:4px;padding:1px 3px}
.th .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.th.txt{background:#fff;padding:4px 3px;font-family:ui-monospace,monospace;font-size:3.6px;line-height:1.35;color:#555;white-space:pre;text-align:left}
.th.txt .k{color:#2F6B57}
.th.page{background:#fff;padding:5px}
.th.page i{display:block;height:2px;background:#ccc;margin:2px 0;border-radius:1px}
.th.page b{display:block;height:3px;width:60%;background:#888;margin-bottom:3px;border-radius:1px}
.th.sheet{background:#fff;display:grid;grid-template-columns:repeat(3,1fr)}
.th.sheet span{border:.5px solid #ddd}
.th.sheet span.h{background:#E8F0EC}
.th.slide{background:linear-gradient(135deg,#2F6B57,#1d3f33)}
.th.slide b{position:absolute;left:5px;top:8px;width:55%;height:3px;background:#fff;border-radius:1px}
.th.slide i{position:absolute;left:5px;top:14px;width:35%;height:2px;background:#ffffff99;border-radius:1px}
.th.ext{background:#fff;display:grid;place-items:center;color:var(--text2)}
.th.ext span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:7px;font-weight:700;color:var(--text2)}
.th.apk{background:#fff;display:grid;place-items:center}
.th.apk div{width:58%;height:58%;border-radius:28%;background:linear-gradient(135deg,#3DDC84,#1a8f55)}
.big .th.txt{font-size:6px}.big .th .dur{font-size:10px}.big .th.ext span{font-size:10px;bottom:8px}
.big .th.page{padding:9px}.big .th.page i{height:3px;margin:4px 0}.big .th.page b{height:5px}
.big .th.slide b{left:9px;top:16px;height:5px}.big .th.slide i{left:9px;top:26px;height:3px}
.ftile .th{border-radius:11px}
</style><style>
.srow{display:flex;align-items:center;gap:16px;min-height:56px;padding:6px 18px;font-size:16px}
.srow .ic{color:var(--text2)}
.srow .t{flex:1}.srow .t div{font-size:13px;color:var(--text3);margin-top:2px}
.srow .v{font-size:14px;color:var(--text2)}
.srow .v.g{color:var(--green);font-weight:600}
.srow+.srow{border-top:1px solid var(--border)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--green);position:relative}
.switch:after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.switch.off{background:#cfd1cb}.switch.off:after{right:auto;left:3px}
.profile{display:flex;align-items:center;gap:16px;padding:16px 18px}
.profile .avatar{width:64px;height:64px}
.profile .nm{font-size:20px;font-weight:600}.profile .sb{font-size:13px;color:var(--text3);margin-top:3px}
.bigav{width:150px;height:150px;border-radius:50%;margin:24px auto 0;position:relative;background:linear-gradient(135deg,#c9b38f,#6f5a3d)}
.cam{position:absolute;right:6px;bottom:6px;width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.dbar{height:10px;border-radius:5px;background:var(--neutral);display:flex;overflow:hidden;margin:10px 0 4px}
.dbar i{height:100%}
.legend{font-size:12px;color:var(--text3)}
.hero{font-size:24px;font-weight:700}
.sub{font-size:13px;color:var(--text3);margin-top:2px}
.dot8{width:10px;height:10px;border-radius:50%;flex:none}
