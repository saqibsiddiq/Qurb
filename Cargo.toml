[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/keys",
    "crates/peer",
    "crates/storage",
    "crates/sync",
    "crates/watcher",
    "experiments/phase0-spike",
]

# Shared dependency versions live here so every crate in the workspace agrees.
# Crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["rayon"] }
fastcdc = "3"
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
debug = true
