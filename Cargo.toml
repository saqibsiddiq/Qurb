[workspace]
resolver = "2"
members = [
    "crates/desktop",
    "crates/engine",
    "crates/keys",
    "crates/mobile-ffi",
    "crates/peer",
    "crates/qurb",
    "crates/relay",
    "crates/signal",
    "crates/storage",
    "crates/sync",
    "crates/tray",
    "crates/watcher",
    "experiments/phase0-spike",
    "experiments/phone-serving",
    "experiments/service-capacity",
]

# Shared dependency versions live here so every crate in the workspace agrees.
# Crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["rayon"] }
fastcdc = "3"
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
debug = true

# The engine as a phone gets it. Link-time optimisation across every crate and
# a single codegen unit let the linker drop what the app never calls and inline
# across crate boundaries, for a smaller library. Slow to build, so it is only
# for what ships; `release` stays quick for trying things. Panics
# still unwind, because UniFFI turns a panic into an error the app can show
# rather than a crash. See decision 0039.
[profile.mobile]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true
