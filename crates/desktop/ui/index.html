<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QurbSpace</title>
  <link rel="stylesheet" href="app.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="win">
    <aside class="sb">
      <div class="sb-brand">QurbSpace</div>
      <nav class="sb-nav" aria-label="Places">
        <button data-go="home"><i data-icon="house"></i><span>Home</span></button>
        <button data-go="files"><i data-icon="folder"></i><span>Files</span></button>
        <button data-go="settings"><i data-icon="settings"></i><span>Settings</span></button>
      </nav>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="setup" id="setup"></div>
  <div class="dropping" id="dropping" aria-hidden="true"><span id="dropping-words">Drop to send</span></div>
  <script src="icons.js"></script>
  <script src="core.js"></script>
  <script src="home.js"></script>
  <script src="devices.js"></script>
  <script src="files.js"></script>
  <script src="settings.js"></script>
  <script src="setup.js"></script>
  <script src="app.js"></script>
</body>
</html>
