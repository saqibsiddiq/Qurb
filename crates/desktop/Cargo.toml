[package]
name = "qurb-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The desktop application: the same daemon, in a window.
#
# Deliberately thin. Everything it shows comes from `qurb_cli::View` and the
# daemon's status channel; nothing here decides anything about syncing.

[[bin]]
name = "qurb-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qurb-cli = { path = "../qurb" }
qurb-keys = { path = "../keys" }
qurb-peer = { path = "../peer" }
qurb-storage = { path = "../storage" }
qurb-sync = { path = "../sync" }

anyhow.workspace = true
# A device's picture to the page as a data: address. Already built for Tauri.
base64 = "0.22"
blake3.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tauri = { version = "2", features = [] }
# A native "choose a file" dialog. Drag-and-drop is the better gesture and needs
# no plugin; this is the accessible way to do the same thing, for anybody who
# cannot drag or is using a keyboard.
tauri-plugin-dialog = "2"
# Desktop notifications, for the few things worth interrupting somebody about.
# Raised from Rust rather than from the page, because a notification is most
# useful exactly when nobody is looking at the window.
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For the user's id, which names the socket a second launch finds the first
# by (`instance`). The disk's size is asked through `qurb_cli::disk`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
