[package]
name = "qurb-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The desktop application: the same daemon, in a window.
#
# Deliberately thin. Everything it shows comes from `qurb_cli::View` and the
# daemon's status channel; nothing here decides anything about syncing.

[[bin]]
name = "qurb-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qurb-cli = { path = "../qurb" }
qurb-keys = { path = "../keys" }
qurb-storage = { path = "../storage" }

anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For the size of the disk the folder is on, which the allowance control needs
# as its maximum. There is no standard-library way to ask.
libc = "0.2"
