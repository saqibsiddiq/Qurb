[package]
name = "qurb-watcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Watches a directory for changes and reports settled ones.
#
# "Settled" is the whole problem: editors write files in bursts, large copies
# arrive over seconds, and the kernel's event queue can overflow. See
# ../../docs/CODEBASE.md and this crate's README.

[dependencies]
anyhow.workspace = true
tokio.workspace = true

notify = "8"
walkdir = "2"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
