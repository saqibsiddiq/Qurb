[package]
name = "qurb-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The program a person actually runs.
#
# Everything else is a library; this is the daemon and the commands around it.

[lib]
name = "qurb_cli"
path = "src/lib.rs"

[[bin]]
name = "qurb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Content hashes, for tracing a chunk a peer asked for back to the send it
# belongs to.
blake3.workspace = true
tokio.workspace = true

qurb-engine = { path = "../engine" }
qurb-keys = { path = "../keys" }
qurb-peer = { path = "../peer" }
qurb-relay = { path = "../relay" }
qurb-signal = { path = "../signal" }
qurb-storage = { path = "../storage" }
qurb-sync = { path = "../sync" }
qurb-watcher = { path = "../watcher" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14.1", default-features = false }

# A filesystem's size and free space (`disk`), and restoring SIGPIPE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Lets `qurb signal --push` wake sleeping devices. Pulls in an HTTP client and
# a JWT signer, so it is off unless asked for.
push = ["qurb-signal/push"]
