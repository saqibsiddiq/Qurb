[package]
name = "qurb-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The program a person actually runs.
#
# Everything else is a library; this is the daemon and the commands around it.

[lib]
name = "qurb_cli"
path = "src/lib.rs"

[[bin]]
name = "qurb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true

qurb-engine = { path = "../engine" }
qurb-keys = { path = "../keys" }
qurb-peer = { path = "../peer" }
qurb-relay = { path = "../relay" }
qurb-signal = { path = "../signal" }
qurb-storage = { path = "../storage" }
qurb-sync = { path = "../sync" }
qurb-watcher = { path = "../watcher" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
