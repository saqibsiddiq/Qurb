[package]
name = "qurb-signal"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The rendezvous service: how two devices behind routers learn where the other
# is, and agree to punch at the same moment.
#
# Deliberately knows nothing about files. See
# ../../docs/decisions/0016-what-signalling-learns.md.

[dependencies]
blake3.workspace = true
qurb-keys = { path = "../keys" }

tokio.workspace = true
# TLS included, because the rendezvous identifiers are bearer secrets and a
# device syncing from a café is sending them across somebody else's network.
# Webpki roots rather than the platform's: they are the same everywhere,
# including on Android, where reaching the system trust store from Rust is its
# own project.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Only for the `push` feature: talking to Firebase needs an HTTP client and a
# signed JWT. Kept optional so a service with no push credentials -- which is
# every test and every self-hosted deployment -- does not carry them.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
jsonwebtoken = { version = "9", optional = true }

tracing = "0.1"

[features]
default = []
push = ["dep:reqwest", "dep:jsonwebtoken"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
