[package]
name = "qurb-mobile"
version = "0.1.0"
edition = "2021"

[lib]
# Both, deliberately. `cdylib` is what Android loads with System.loadLibrary;
# `staticlib` is what an iOS app and its FileProvider extension link, because an
# extension cannot dlopen a shared library from the app bundle.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Tor as the slow last resort (decision 0082): the client half only, a phone
# reaching its computer's onion service. On: the owner asked for it, at 6.7 MB.
default = ["tor"]
tor = ["qurb-peer/tor"]

[dependencies]
# Only for the type `Served` names a served chunk by.
blake3.workspace = true
qurb-engine = { path = "../engine" }
qurb-storage = { path = "../storage" }
qurb-watcher = { path = "../watcher" }
qurb-keys = { path = "../keys" }
qurb-sync = { path = "../sync" }
qurb-peer = { path = "../peer" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
# The pairing code as a QR code the screen can draw: the same crate the
# command line uses, without its image features.
qrcode = { version = "0.14.1", default-features = false }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
tracing = "0.1"

# The engine's logs, on the platform that cannot be attached to a terminal.
#
# Without a subscriber every `tracing::` call in the whole engine is discarded,
# which is what it was doing on Android: a local-discovery failure had to be
# diagnosed entirely from the laptop's side, because the phone's own account of
# what it did went nowhere. Android only, since every other platform has stderr.
[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
# Only the registry and a plain target filter: the environment-variable
# filter brought regex, 0.2 MB of the engine, to read a variable a phone
# never sets (2026-11-02, decision 0082's room for Tor).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
blake3.workspace = true
tempfile = "3"
qurb-signal = { path = "../signal" }
qurb-relay = { path = "../relay" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
