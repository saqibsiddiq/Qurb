[package]
name = "qurb-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The fallback path, for when two devices cannot reach each other directly.
#
# Forwards opaque bytes. A full QUIC session with pinned certificates runs
# through it, so it can neither read what it carries nor forge anything.
# See ../../docs/decisions/0017-relay.md.

[dependencies]
tokio.workspace = true
quinn = "0.11"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
