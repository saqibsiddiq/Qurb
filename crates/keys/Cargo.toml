[package]
name = "qurb-keys"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The root secret, the keys derived from it, and the recovery phrase that is the
# only way back to it.
#
# Deliberately knows nothing about storage or networking: it produces key
# material and the caller decides what to do with it.

[dependencies]
bip39 = "2"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
thiserror = "2"

[dev-dependencies]
qurb-storage = { path = "../storage" }
tempfile = "3"
