[package]
name = "qurb-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Joins the filesystem watcher to the store: decides what work a change implies,
# and does it. See ../../docs/CODEBASE.md.

[dependencies]
anyhow.workspace = true
blake3.workspace = true
tokio.workspace = true

qurb-storage = { path = "../storage" }
qurb-sync = { path = "../sync" }
qurb-watcher = { path = "../watcher" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
