[package]
name = "qurb-peer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Talking to another device: the wire format, a QUIC transport, and the client
# that turns a sync plan into bytes over the network.
#
# Sits above the engine rather than below it — the engine knows nothing about
# networks, and this crate adapts it to one.

[dependencies]
blake3.workspace = true
tokio.workspace = true

qurb-engine = { path = "../engine" }
qurb-keys = { path = "../keys" }
qurb-storage = { path = "../storage" }
qurb-relay = { path = "../relay" }
qurb-signal = { path = "../signal" }
qurb-sync = { path = "../sync" }

quinn = "0.11"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
quinn = "0.11"
rand = "0.8"
qurb-keys = { path = "../keys" }
qurb-watcher = { path = "../watcher" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
